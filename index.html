<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-vaga – Eletropostos em Manaus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F8F3;--w:#fff;--k:#12241A;--m:#4F675A;--l:#D2E2D7;--g:#1E8E4F;--gd:#0E5C34;--gl:#E3F3E8;--lf:#7DD957;--r:#B3261E;--c:#888}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{font:15px/1.45 Barlow,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--k);display:flex;flex-direction:column}
h1,h2,h3,.b,.tabs button,.kp b{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
h1{font-size:clamp(34px,5vw,56px);line-height:1;margin:0 0 14px}h2{font-size:25px;margin:6px 0;color:var(--gd)}h3{font-size:17px;margin:18px 0 6px;color:var(--gd);border-bottom:2px solid var(--gl);padding-bottom:3px;text-transform:uppercase;letter-spacing:.04em}p{margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
input:not([type=checkbox]),select,textarea{width:100%;padding:9px 11px;border:1px solid #B7CDBD;border-radius:8px;background:var(--w)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}label.ck{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin:6px 12px 6px 0}
.b{border:2px solid var(--g);background:var(--g);color:#fff;padding:7px 15px;min-height:42px;font-size:17px;font-weight:600;letter-spacing:.04em;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.b:hover{background:var(--gd);border-color:var(--gd)}.b.o{background:transparent;color:var(--gd)}.b.o:hover{background:var(--gl)}.b.r{background:var(--r);border-color:var(--r)}.b.w{width:100%;justify-content:center;margin-top:14px}.b.s{min-height:34px;padding:2px 11px;font-size:15px}
:focus-visible{outline:3px solid #1C6FD1;outline-offset:2px}
.mut{color:var(--m);font-size:14px}.err{color:var(--r);font-weight:600;min-height:20px;margin:8px 0}.ok{color:var(--gd);font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.top{display:flex;align-items:center;gap:14px;background:var(--w);border-bottom:3px solid var(--g);padding:4px 16px;padding-top:calc(4px + env(safe-area-inset-top,0));height:68px}.lg{height:58px;width:auto;display:block}.top .sp{flex:1}.who{display:flex;gap:10px;align-items:center;font-size:14px;text-align:right}.who b{display:block;font-size:15px}
main{flex:1;display:grid;grid-template-columns:420px 1fr;min-height:0}#side{overflow:auto;background:var(--bg);border-right:1px solid var(--l)}#mapw{position:relative;min-height:0;background:#dfe9e2}#map{position:absolute;inset:0}.pad{padding:12px 16px calc(24px + env(safe-area-inset-bottom,0))}
.hint,.leg{position:absolute;z-index:3;background:var(--w);border:1px solid var(--l);border-radius:10px;box-shadow:0 2px 8px #0002;padding:7px 11px;font-size:13px}.hint{top:10px;left:10px;max-width:260px;border-left:5px solid #1C6FD1}.leg{left:10px;bottom:22px;display:flex;gap:10px;flex-wrap:wrap}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:40vh 1fr}#mapw{order:-1}#side{border-right:0;border-top:3px solid var(--g)}.hint{max-width:190px;font-size:12px}.leg{display:none}.who span{display:none}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--w);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}.tabs button{flex:0 0 auto;border:0;background:none;padding:7px 14px;font-size:17px;font-weight:600;border-radius:99px;cursor:pointer;color:var(--m)}.tabs [aria-selected=true]{background:var(--g);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.it{display:block;width:100%;text-align:left;background:var(--w);border:1px solid var(--l);border-left:6px solid var(--c);padding:10px 12px;margin-bottom:8px;cursor:pointer;border-radius:10px;box-shadow:0 1px 3px #0001}button.it:hover{background:#f7fcf8}.it b{display:block;font-size:16px}.it span{display:block;font-size:13.5px;color:var(--m)}.it .s2{color:var(--c);font-weight:700}
.st{display:inline-block;border:1px solid var(--c);border-left:6px solid var(--c);padding:2px 9px;font-weight:600;font-size:13px;background:var(--w);border-radius:6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin:8px 0}dt{color:var(--m)}dd{margin:0;font-weight:600}
.cm{border-left:3px solid var(--lf);padding-left:10px;margin:6px 0;color:var(--m)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kp div{background:var(--w);border:1px solid var(--l);border-radius:10px;padding:8px 10px}.kp b{display:block;font-size:30px;line-height:1.1;color:var(--g)}.kp span{font-size:12px;color:var(--m)}
.bar{display:flex;align-items:flex-end;gap:3px;height:90px;border-bottom:2px solid var(--g)}.bar i{flex:1;background:var(--lf);border-radius:3px 3px 0 0}
.star{background:none;border:0;font-size:32px;color:#D49A00;cursor:pointer;padding:0 2px}
.report{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.report th,.report td{border:1px solid var(--l);padding:6px;text-align:left}.report th{background:var(--gd);color:#fff}.scroll{overflow:auto}
#auth{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}.aL{background:var(--gd);color:#fff;padding:24px 40px 48px;display:flex;flex-direction:column;justify-content:center;position:relative}.aL .lgbox{position:absolute;top:18px;left:18px;background:#fff;border-radius:12px;padding:6px 10px}.aL .lgbox img{height:76px;display:block}.aL h1{margin-top:90px}.aL p{max-width:44ch;color:#d4eadb;margin-bottom:24px;font-size:17px}.aR{padding:40px;max-width:500px;width:100%;margin:auto}.aR .tabs{border:1px solid var(--l);border-radius:99px;margin-bottom:8px;position:static}
@media(max-width:820px){#auth{grid-template-columns:1fr}.aL{padding:20px}.aL h1{margin-top:96px}.aR{padding:20px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gd);color:#fff;border-radius:10px;padding:10px 16px;z-index:2000;display:none;max-width:90vw;box-shadow:0 3px 12px #0004}
.test-accounts{margin-top:18px;padding:12px;border:1px dashed var(--g);border-radius:10px;background:#fff}.test-accounts h3{margin:0 0 6px;border:0}
a.lk{color:var(--gd);font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
</style>
</head>

if(p=='register'){const r=await sb.auth.signUp({email:b.email,password:b.senha,options:{data:{nome:b.nome,cpf:b.cpf,conector:b.conector}}});chk(r);if(!r.data.session)throw new Error('Conta criada. Enviamos um e-mail de confirmação: confirme e depois entre.');return prof()}
if(p=='login'){chk(await sb.auth.signInWithPassword({email:b.email,password:b.senha}));return prof()}
if(p=='recover'){chk(await sb.auth.resetPasswordForEmail(b.email,{redirectTo:location.origin+location.pathname}));return {}}
if(p=='newpw'){chk(await sb.auth.updateUser({password:b.nova}));return {}}
if(p=='me')return prof();if(p=='logout'){await sb.auth.signOut();return {}}
const u=await sess();
if(p=='users')return chk(await sb.from('profiles').select('id,nome,email,role,org,cpf').order('nome'));
if(p=='setrole'){chk(await sb.rpc('admin_set_role',{uid:b.id,new_role:b.role,new_org:b.org||null}));return chk(await sb.from('profiles').select('id,nome,email,role,org,cpf').order('nome'))}
if(p=='vehicle')chk(await sb.from('profiles').update({veiculo:b}).eq('id',u.id));
else if(p=='password'){chk(await sb.auth.signInWithPassword({email:u.email,password:b.atual}));chk(await sb.auth.updateUser({password:b.nova}))}
else if(p=='profile')chk(await sb.from('profiles').update({nome:b.nome,cpf:b.cpf||null}).eq('id',u.id));
else if(p=='review')chk(await sb.from('reviews').insert({station_id:b.id,star:b.star,comment:b.comment||null}));
else if(p=='occ')chk(await sb.from('occurrences').insert({station_id:b.id,tp:b.tp,d:b.d}));
else if(p=='station')chk(await sb.from('stations').insert({...stRow(b),op:b.op,ch:b.ch,cf:'Média',updated_at:new Date().toISOString()}));
else if(p=='stationUpd')await upd(sb.from('stations').update({...stRow(b),op:b.op,ch:b.ch,updated_at:new Date().toISOString()}).eq('id',b.id));
else if(p=='stationDel')await upd(sb.from('stations').delete().eq('id',b.id));
else if(p=='org')chk(await sb.from('orgs').insert({name:b.name}));
else if(p=='charger'){const c=[...chk(await sb.from('stations').select('ch').eq('id',b.id).single()).ch];c[b.i]=b.s;await upd(sb.from('stations').update({ch:c.join(''),cf:'Alta',updated_at:new Date().toISOString()}).eq('id',b.id))}
else if(p=='resp')await upd(sb.from('occurrences').update({rs:b.rs,s:b.s}).eq('id',b.oid));
else if(p=='block')await upd(sb.from('orgs').update({blocked:b.blocked}).eq('name',b.org));
return loadState()}
async function act(fn){try{await fn()}catch(x){if(x.auth){S.guest=false;S.user=null;S.role=null;R();$('#aerr').textContent='Entre na sua conta para continuar.'}else toast(x.message)}}
function applyS(s){E.length=0;s.E.forEach(x=>{if(x.lat==null&&GC[x.id])[x.lat,x.lng]=GC[x.id];E.push(x)});
const o=Object.fromEntries(S.not.map(n=>[n.id,n.l])),fresh=s.not.filter(n=>ready&&!(n.id in o));S.not=s.not.map(n=>({...n,l:o[n.id]||0}));if(fresh.length&&S.role=='c')toast('Nova notificação: '+fresh[0].t);
S.occ=s.occ;S.blk=s.blk;ready=1;if(map&&E.some(e=>e.lat==null))geocodePend()}
const idle=()=>!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
async function poll(){try{const s=await API('state'),j=JSON.stringify(s);if(j!==last){last=j;applyS(s);if(S.user||S.guest){if(idle())side();else mapSync()}}}catch(e){}}
function setUser(j){S.user=j;S.role=j.role;S.op=j.org||'';if(j.v)S.v=j.v;S.guest=false;S.tab=S.role=='o'?'carg':S.role=='g'||S.role=='a'?'painel':'busca';S.sel=null}
const cpfFmt=v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'),cpfDigits=v=>String(v||'').replace(/\D/g,'');

L.forEach(e=>{const on=S.sel==e.id,k=JSON.stringify([e.lat,e.lng,e.n,e.ch,on]);let m=MK[e.id];if(!m){m=MK[e.id]=new google.maps.Marker({map,optimized:false});m.addListener('click',()=>pick(e.id))}
if(m._k!==k){m._k=k;m.setPosition({lat:e.lat,lng:e.lng});m.setIcon(pinIcon(e,on));m.setTitle(`${e.n}: ${av(e)} de ${e.ch.length} livres`);m.setZIndex(on?999:1)}});
heat.forEach(c=>c.setMap(null));heat=[];if((S.role=='g'||S.role=='a')&&(S.tab=='painel'||S.tab=='rel'))L.forEach(e=>heat.push(new google.maps.Circle({map,center:{lat:e.lat,lng:e.lng},radius:250+dem(e)*7,strokeColor:'#1E8E4F',strokeWeight:1,fillColor:'#7DD957',fillOpacity:.35,clickable:false})))}
function clearRoute(){if(routeL)routeL.setMap(null);routeL=null;S.rt=null;S.fit=0}
function geo(){if(!navigator.geolocation)return toast('Seu navegador não permite localização.');navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude};if(map){me.setPosition(S.pos);map.setCenter(S.pos);map.setZoom(14)}side()},()=>toast('Não foi possível obter a localização. Usando o Centro de Manaus.'))}

function side(){const el=$('#side'),sc=el.scrollTop,T=tabsFor();if(!T.some(t=>t[0]==S.tab)&&!(S.tab=='cad'&&S.role=='a'))S.tab=T[0][0];const V={busca:()=>S.sel?detail():busca(),veic,ativ,conta,carg,cad:cadPosto,ocor,painel,rel:relatorio,ops,adm,usr};

function busca(){const f=S.f,l=fl();return `<form onsubmit="return ap(event)"><label for="fq">Buscar por nome, bairro ou endereço</label><input id="fq" value="${esc(f.q)}" placeholder="Ex.: Ponta Negra, Studio 5, Djalma Batista">

<div class="row"><label class="ck"><input type="checkbox" id="fd" ${f.disp?'checked':''} onchange="ap()">Só com carregador livre</label><label class="ck"><input type="checkbox" id="fo" ${f.open?'checked':''} onchange="ap()">Abertos agora</label></div>
<div class="row"><button class="b">Buscar</button><button type="button" class="b o" onclick="S.f={q:'',conn:'',kw:0,pmax:0,dmax:0,sort:'dist',disp:false,open:false};side()">Limpar</button><button type="button" class="b o" onclick="geo()">Usar minha localização</button></div></form>
<h3>${l.length} de ${E.length} eletropostos</h3>${l.map(e=>`<button class="it" style="--c:${col(e)}" onclick="pick(${e.id})"><b>${esc(e.n)}</b><span>${esc(e.b)}${e.lat==null?' (sem posição no mapa)':': '+dist(e).toFixed(1)+' km, cerca de '+mins(e)+' min'}</span><span class="s2">${av(e)?av(e)+' de '+e.ch.length+' livres':'Nenhum carregador livre'}</span><span>${e.kw} kW, R$ ${e.p.toFixed(2).replace('.',',')}/kWh · nota ${avg(e)} · atualizado há ${e.u} min</span></button>`).join('')||'<p>Nenhum eletroposto atende a esses filtros. Tente remover algum.</p>'}`}
function ap(ev){if(ev)ev.preventDefault();S.f={q:$('#fq').value,conn:$('#fc').value,kw:+$('#fk').value,pmax:+$('#fp').value,dmax:+$('#fm').value,sort:$('#fs').value,disp:$('#fd').checked,open:$('#fo').checked};S.hist.unshift({k:'Busca',t:S.f.q||'Filtros aplicados'});side();return false}
function pick(id){const e=gE(id);if(!e)return;if(S.role=='o'||S.role=='g'||S.role=='a'){toast(`${e.n}: ${av(e)} de ${e.ch.length} livres`);map&&e.lat!=null&&map.panTo({lat:e.lat,lng:e.lng});return}
S.tab='busca';S.sel=id;S.mode='info';clearRoute();if(!S.hist.some(h=>h.k=='Consulta'&&h.t==e.n))S.hist.unshift({k:'Consulta',t:e.n});side();if(map&&e.lat!=null){map.panTo({lat:e.lat,lng:e.lng});map.setZoom(15)}}
function back(){S.sel=null;clearRoute();side()}
function detail(){const e=gE(S.sel),m=S.mode;return `<button class="b o s" onclick="${m=='info'?'back()':"S.mode='info';side()"}">← ${m=='info'?'Voltar à lista':'Voltar'}</button>`+(m=='rota'?rota_(e):m=='aval'?aval(e):m=='prob'?prob(e):info(e))}
function info(e){const ok=e.c.includes(S.v.conn);return `<h2>${esc(e.n)}</h2><div class="mut">${esc(e.addr||e.b+', Manaus')}<br>Operador: ${esc(e.op)}</div>${av(e)?'':'<p class="err">Nenhum carregador livre agora.</p>'}<h3>Carregadores</h3><div class="row">${[...e.ch].map((c,i)=>`<span class="st" style="--c:${SL[c][1]}">#${i+1} ${SL[c][0]}</span>`).join('')}</div>
<dl><dt>Conectores</dt><dd>${e.c.map(esc).join(', ')} (${ok?'serve no seu carro':'não serve no seu carro'})</dd><dt>Potência</dt><dd>${e.kw} kW</dd><dt>Preço</dt><dd>R$ ${e.p.toFixed(2).replace('.',',')} por kWh (simulado)</dd><dt>Funcionamento</dt><dd>${esc(hrs(e))}</dd><dt>Carga 20% a 80%</dt><dd>${e.kw?'cerca de '+Math.round(36/e.kw/.9*60)+' min (bateria de 60 kWh)':'-'}</dd><dt>Atualizado</dt><dd>há ${e.u} min</dd><dt>Confiabilidade</dt><dd>${e.cf}</dd><dt>Nota média</dt><dd>${avg(e)} de 5 (${e.r.length} avaliações)</dd></dl>
<p class="mut">Endereço, conectores e potência vêm de fontes públicas. Preço e status em tempo real são simulados nesta demonstração.</p>
<h3>Comentários</h3>${e.cm.slice(0,5).map(c=>`<p class="cm">${esc(c)}</p>`).join('')||'<p class="mut">Ainda sem comentários.</p>'}<div class="row"><button class="b" onclick="rota()" ${e.lat==null?'disabled':''}>Traçar rota</button><button class="b o" onclick="S.mode='aval';S.star=0;side()">Avaliar</button><button class="b o" onclick="S.mode='prob';side()">Registrar problema</button></div>`}
async function calcRoute(){const e=gE(S.sel);if(!e||e.lat==null)return;let rt,path;
try{const r=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':CFG.GOOGLE_MAPS_KEY,'X-Goog-FieldMask':'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline'},body:JSON.stringify({origin:{location:{latLng:{latitude:S.pos.lat,longitude:S.pos.lng}}},destination:{location:{latLng:{latitude:e.lat,longitude:e.lng}}},travelMode:'DRIVE',routingPreference:'TRAFFIC_AWARE',languageCode:'pt-BR'})}),x=(await r.json()).routes[0];
rt={km:x.distanceMeters/1000,min:Math.round(parseInt(x.duration)/60)};path=google.maps.geometry.encoding.decodePath(x.polyline.encodedPolyline)}
catch(_){rt={km:dist(e),min:mins(e),est:1};path=[S.pos,{lat:e.lat,lng:e.lng}]}
if(S.sel!=e.id||S.mode!='rota')return;S.rt=rt;if(map){if(!routeL)routeL=new google.maps.Polyline({map,strokeColor:'#1E8E4F',strokeWeight:6});routeL.setOptions({strokeOpacity:rt.est?.5:.9});routeL.setPath(path);if(!S.fit){const b=new google.maps.LatLngBounds();path.forEach(q=>b.extend(q));map.fitBounds(b,50);S.fit=1}}side()}
async function rota(){const e=gE(S.sel);S.mode='rota';clearRoute();S.hist.unshift({k:'Rota',t:'Até '+e.n});side();await calcRoute()}
function rota_(e){const t=S.rt;if(!t)return '<h2>Calculando rota…</h2>';const ok=e.c.includes(S.v.conn),alt=E.filter(x=>x.id!=e.id&&x.lat!=null&&av(x)&&x.c.includes(S.v.conn)).sort((a,b)=>dist(a)-dist(b)).slice(0,2);
return `<h2>Rota até ${esc(e.n)}</h2><p class="mut">Arraste o ponto azul no mapa: a rota é recalculada a partir da nova posição.</p><dl><dt>Distância</dt><dd>${t.km.toFixed(1)} km${t.est?' (estimativa em linha reta)':''}</dd><dt>Tempo</dt><dd>${t.min} min de carro</dd><dt>Conector</dt><dd>${ok?'Compatível':'Incompatível com '+esc(S.v.conn)}</dd><dt>Autonomia atual</dt><dd>${rng().toFixed(0)} km</dd></dl>${t.km>rng()?'<p class="err">A autonomia atual pode não ser suficiente para chegar.</p>':''}${av(e)?'':'<p class="err">Este ponto está sem carregador livre agora.</p>'}
<div class="row"><a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}">Abrir no Google Maps</a></div><h3>Alternativas livres e compatíveis</h3>${alt.map(a=>`<button class="it" style="--c:${col(a)}" onclick="pick(${a.id})"><b>${esc(a.n)}</b><span>${dist(a).toFixed(1)} km, ${mins(a)} min</span></button>`).join('')||'<p class="mut">Nenhuma agora.</p>'}`}
function aval(e){return `<h2>Avaliar ${esc(e.n)}</h2><div role="group" aria-label="Nota">${[1,2,3,4,5].map(i=>`<button class="star" aria-label="${i} estrelas" onclick="S.star=${i};side()">${i<=S.star?'★':'☆'}</button>`).join('')}</div><label for="ac">Comentário (opcional)</label><textarea id="ac" rows="3"></textarea><p class="err" id="ferr"></p><button class="b" onclick="sendA()">Enviar avaliação</button>`}
function sendA(){if(!S.star)return $('#ferr').textContent='Escolha uma nota de 1 a 5.';act(async()=>{applyS(await API('review',{id:S.sel,star:S.star,comment:$('#ac').value.trim()}));S.hist.unshift({k:'Avaliação',t:gE(S.sel).n});S.mode='info';side();toast('Avaliação enviada.')})}

function sendP(){const d=$('#pd').value.trim();if(d.length<10)return $('#ferr').textContent='Descreva com pelo menos 10 caracteres.';act(async()=>{applyS(await API('occ',{id:S.sel,tp:$('#pt').value,d}));S.hist.unshift({k:'Problema',t:gE(S.sel).n});S.mode='info';side();toast('Relato enviado. Situação: Aberta.')})}

function ocor(){if(S.ro)return `<button class="b o s" onclick="S.ro=null;side()">← Voltar</button><h2>Responder ocorrência</h2><label for="rt">Resposta</label><textarea id="rt" rows="3"></textarea><label for="rs">Situação</label><select id="rs"><option>Em análise</option><option>Resolvida</option></select><p class="err" id="ferr"></p><button class="b" onclick="sendR()">Enviar resposta</button>`;
const l=S.occ.filter(o=>gE(o.e)&&gE(o.e).op==S.op);return `<h2>Ocorrências</h2>${l.map(o=>`<div class="it" style="--c:${o.s=='Resolvida'?'#1E8E4F':'#D49A00'}"><b>${esc(o.tp)}</b><span>${esc(gE(o.e).n)}</span><span style="color:var(--k)">${esc(o.d)}</span><span class="s2">${o.s}</span>${o.rs?`<span>Resposta: ${esc(o.rs)}</span>`:''}<button class="b s" style="margin-top:6px" onclick="S.ro=${o.id};side()">Responder</button></div>`).join('')||'<p class="mut">Nenhuma ocorrência para os seus pontos.</p>'}`}
function sendR(){const t=$('#rt').value.trim();if(!t)return $('#ferr').textContent='Escreva uma resposta.';act(async()=>{applyS(await API('resp',{oid:S.ro,rs:t,s:$('#rs').value}));S.ro=null;side();toast('Resposta enviada.')})}
function cadPosto(){const e=S.edit?gE(S.edit):null,cnt=t=>e?e.cn.filter(x=>x==t).length:(t=='CCS2'?1:0),f=(k,d='')=>esc(e?e[k]:d);
return `<h2>${e?'Editar eletroposto':'Cadastrar eletroposto'}</h2><p class="mut">Clique no mapa para preencher a latitude e a longitude, ou use o endereço.</p>${S.role=='a'?`<label for="sop">Organização</label><select id="sop">${orgs().map(o=>`<option ${e&&e.op==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}
<label for="sn">Nome</label><input id="sn" value="${f('n')}"><div class="g2"><div><label for="sb">Bairro</label><input id="sb" value="${f('b')}"></div><div><label for="sa">Endereço</label><input id="sa" value="${f('addr')}"></div></div><div class="row"><button type="button" class="b o s" onclick="geoForm()">Localizar pelo endereço</button></div>
<div class="g2"><div><label for="sla">Latitude</label><input id="sla" type="number" step="any" value="${e&&e.lat!=null?e.lat:''}"></div><div><label for="slo">Longitude</label><input id="slo" type="number" step="any" value="${e&&e.lng!=null?e.lng:''}"></div></div>
<div class="g2"><div><label for="sk">Potência (kW)</label><input id="sk" type="number" min="1" value="${e?e.kw:''}"></div><div><label for="sp">Preço por kWh (R$)</label><input id="sp" type="number" min="0" step="0.01" value="${e?e.p:''}"></div></div><label for="sh">Funcionamento</label><input id="sh" placeholder="24 horas ou 6h às 22h" value="${f('h')}">
<label>Carregadores por conector</label><div class="g2">${CONN.map((t,i)=>`<div><span class="mut">${t}</span><input id="sc${i+1}" type="number" min="0" max="20" value="${cnt(t)}"></div>`).join('')}</div><p class="err" id="ferr"></p><div class="row"><button class="b" onclick="sendPosto()">${e?'Salvar alterações':'Cadastrar eletroposto'}</button>${e?'<button class="b o" onclick="S.edit=null;S.tab=S.role==\'a\'?\'adm\':\'carg\';side()">Cancelar</button>':''}</div>`}
async function geoForm(){const a=$('#sa').value.trim();if(!a)return $('#ferr').textContent='Digite o endereço.';if(!window.google||window.gmBad)return $('#ferr').textContent='O mapa do Google não está disponível.';try{const r=await new google.maps.Geocoder().geocode({address:a+', Manaus - AM, Brasil',region:'BR'}),p=r.results[0].geometry.location;$('#sla').value=p.lat().toFixed(6);$('#slo').value=p.lng().toFixed(6);map.panTo(p);map.setZoom(16);$('#ferr').textContent=''}catch(x){$('#ferr').textContent='Não foi possível localizar. Ative a Geocoding API ou clique no mapa.'}}
function sendPosto(){const g=i=>$('#'+i).value.trim(),n=g('sn'),b=g('sb'),a=g('sa'),lat=parseFloat(g('sla')),lng=parseFloat(g('slo')),kw=+g('sk'),p=+g('sp'),er=t=>$('#ferr').textContent=t;
if(!n||!b||!a||isNaN(lat)||isNaN(lng)||!(kw>0)||g('sp')===''||!(p>=0))return er('Preencha nome, bairro, endereço, localização, potência e preço.');if(lat<-3.4||lat>-2.7||lng<-60.4||lng>-59.6)return er('A localização precisa ficar dentro de Manaus.');
const c=[];CONN.forEach((t,i)=>{for(let k=0;k<Math.max(0,Math.min(20,+$('#sc'+(i+1)).value||0));k++)c.push(t)});if(!c.length)return er('Informe pelo menos um carregador.');
const old=S.edit?gE(S.edit).ch:'',ch=(old+'d'.repeat(c.length)).slice(0,c.length),op=S.role=='a'?$('#sop').value:S.op;
act(async()=>{applyS(await API(S.edit?'stationUpd':'station',{id:S.edit,op,nome:n,bairro:b,endereco:a,lat,lng,kw,preco:p,conectores:c,horario:g('sh')||'24 horas',ch}));const was=S.edit;S.edit=null;S.tab=S.role=='a'?'adm':'carg';if(pickMk){pickMk.setMap(null);pickMk=null}side();toast(was?'Eletroposto atualizado.':'Eletroposto cadastrado.')})}
/* ---------- gestor e administrador ---------- */
function G(){const g=S.gf;return E.filter(e=>(!g.op||e.op==g.op)&&(!g.st||(g.st=='ind'?!av(e):av(e))))}
const gfilt=()=>`<div class="row"><select aria-label="Operador" onchange="S.gf.op=this.value;side()">${opt([['','Todos os operadores'],...orgs().map(o=>[o,o])],S.gf.op)}</select><select aria-label="Situação" onchange="S.gf.st=this.value;side()">${opt([['','Qualquer situação'],['ind','Sem carregador livre'],['dis','Com carregador livre']],S.gf.st)}</select></div>`;
function painel(){const L=G(),all=L.flatMap(e=>[...e.ch]),n=c=>all.filter(x=>x==c).length,t=all.length||1,h=[4,6,12,24,28,22,30,36,40,25,12,6];
return `${gfilt()}<div class="kp"><div><b>${L.length}</b><span>Eletropostos</span></div><div><b>${all.length}</b><span>Carregadores</span></div><div><b>${Math.round(n('d')/t*100)}%</b><span>Disponibilidade</span></div><div><b>${n('o')}</b><span>Ocupados</span></div><div><b>${n('m')+n('f')}</b><span>Indisponíveis</span></div><div><b>${L.length?(L.reduce((a,e)=>a+(+avg(e)||0),0)/L.length).toFixed(1):'-'}</b><span>Nota média</span></div></div>
<h3>Demanda por horário, 6h às 24h (exemplo)</h3><div class="bar" role="img" aria-label="Pico entre 16h e 20h">${h.map(v=>`<i style="height:${v*2.2}px"></i>`).join('')}</div><p class="mut">Os círculos verdes no mapa mostram a demanda simulada em cada posto.</p>
<div class="row"><button class="b" onclick="csv()">Exportar CSV</button></div><h3>Eletropostos</h3>${L.map(e=>`<div class="it" style="--c:${col(e)}"><b>${esc(e.n)}</b><span>${esc(e.op)}, ${esc(e.b)}</span><span>Ocupação ${Math.round([...e.ch].filter(c=>c=='o').length/e.ch.length*100)}%, ${[...e.ch].filter(c=>c=='m'||c=='f').length} indisponíveis, confiabilidade ${e.cf}</span></div>`).join('')}`}
function relatorio(){const L=G(),occ=L.flatMap(e=>S.occ.filter(o=>o.e==e.id)),ind=L.reduce((a,e)=>a+[...e.ch].filter(c=>c=='m'||c=='f').length,0),dm=L.reduce((a,e)=>a+[...e.ch].filter(c=>c=='o').length,0);
return `<h2>Relatório da rede</h2><p class="mut">Demonstrativo de demanda e indisponibilidade.</p>${gfilt()}<div class="kp"><div><b>${L.length}</b><span>Eletropostos</span></div><div><b>${dm}</b><span>Ocupados</span></div><div><b>${ind}</b><span>Indisponíveis</span></div><div><b>${occ.length}</b><span>Ocorrências</span></div><div><b>${occ.filter(o=>o.s=='Resolvida').length}</b><span>Resolvidas</span></div><div><b>${occ.filter(o=>o.s!='Resolvida').length}</b><span>Em aberto</span></div></div>
<div class="row"><button class="b" onclick="csv()">Exportar CSV</button></div><h3>Resumo por eletroposto</h3><div class="scroll"><table class="report"><thead><tr><th>Posto</th><th>Operador</th><th>Ocupados</th><th>Indisp.</th><th>Demanda*</th><th>Nota</th><th>Atualiz.</th></tr></thead><tbody>${L.map(e=>`<tr><td>${esc(e.n)}</td><td>${esc(e.op)}</td><td>${[...e.ch].filter(c=>c=='o').length}</td><td>${[...e.ch].filter(c=>c=='m'||c=='f').length}</td><td>${dem(e)}%</td><td>${avg(e)}</td><td>${e.u} min</td></tr>`).join('')}</tbody></table></div><p class="mut">*Demanda simulada.</p>`}
function csv(){const r=[['Eletroposto','Operador','Bairro','Livres','Ocupados','Manutencao','Fora de servico','Demanda simulada %','Nota','Confiabilidade'],...G().map(e=>{const c=k=>[...e.ch].filter(x=>x==k).length;return [e.n,e.op,e.b,c('d'),c('o'),c('m'),c('f'),dem(e),avg(e),e.cf]})],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download='evaga-relatorio.csv';a.click()}
function ops(){return `<h2>Operadores</h2>${orgs().map(o=>`<div class="it" style="--c:${S.blk[o]?'#B3261E':'#1E8E4F'}"><b>${esc(o)}</b><span>${E.filter(e=>e.op==o).length} eletropostos</span><span class="s2">${S.blk[o]?'Acesso bloqueado':'Cadastro ativo'}</span><button class="b s ${S.blk[o]?'':'r'}" style="margin-top:6px" onclick="blk(decodeURIComponent('${encodeURIComponent(o)}'))">${S.blk[o]?'Liberar acesso':'Bloquear acesso'}</button></div>`).join('')}
${S.role=='a'?`<h3>Nova organização</h3><div class="row"><input id="no" placeholder="Nome da operadora" style="flex:1"><button class="b" onclick="addOrg()">Criar</button></div><p class="err" id="ferr"></p>`:''}`}
function blk(o){if(!confirm(`${S.blk[o]?'Liberar':'Bloquear'} o acesso de ${o}?`))return;act(async()=>{applyS(await API('block',{org:o,blocked:!S.blk[o]}));side();toast('Permissão atualizada.')})}
function addOrg(){const n=$('#no').value.trim();if(n.length<2)return $('#ferr').textContent='Digite o nome da organização.';act(async()=>{applyS(await API('org',{name:n}));side();toast('Organização criada.')})}
function loadUsers(){act(async()=>{S.users=await API('users');side()})}
function usr(){if(!S.users)return '<p class="mut">Carregando usuários…</p>';return `<h2>Usuários</h2><p class="mut">Altere o perfil de acesso. Operadores precisam de uma organização.</p>${S.users.map((u,i)=>`<div class="it" style="--c:var(--g)"><b>${esc(u.nome)}</b><span>${esc(u.email||'')}</span><div class="g2"><select id="ur${i}" aria-label="Perfil">${opt(Object.entries(LB),u.role)}</select><select id="uo${i}" aria-label="Organização"><option value="">Sem organização</option>${orgs().map(o=>`<option ${u.org==o?'selected':''}>${esc(o)}</option>`).join('')}</select></div><button class="b s" style="margin-top:6px" onclick="setRole(${i})">Salvar</button></div>`).join('')}`}
function setRole(i){const u=S.users[i],r=$('#ur'+i).value,o=$('#uo'+i).value;if(r=='o'&&!o)return toast('Escolha a organização do operador.');act(async()=>{S.users=await API('setrole',{id:u.id,role:r,org:o});side();toast('Perfil atualizado.')})}
/* ---------- início ---------- *
(async()=>{try{setUser((await API('me')).user)}catch(_){}await poll();R();setInterval(poll,6000)})();
</script>
</body>
</html>
